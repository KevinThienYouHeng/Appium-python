name: Appium Android Tests

# When to run
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  appium-test:
    runs-on: ubuntu-latest   # free GitHub runner

    steps:
      # 1. Checkout your code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Set up JDK (Android SDK needs Java)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # 5. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 6. Download the demo app APK
      - name: Download MyDemoApp APK
        run: |
          wget -q -O MyDemoApp.apk \
            "https://github.com/saucelabs/my-demo-app-android/releases/download/2.2.0/mda-2.2.0-25.apk"

      # 7. Install and start Appium server
      - name: Install Appium
        run: |
          npm install -g appium
          appium --version

      # 8. Start Appium server in background
      - name: Start Appium server
        run: |
          appium --log-level info &
          sleep 5
          curl http://localhost:4723/status

      # 9. Start Android Emulator and run tests
      # THIS IS THE SLOW PART — see explanation below
      - name: Run tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29          # Android 10
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # How long to wait for emulator boot before failing
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            echo "Waiting for device..."
            adb wait-for-device
            adb shell input keyevent 82   # unlock screen
            sleep 2
            echo "Running pytest..."
            pytest tests/ -v --tb=short

      # 10. Upload test artifacts (screenshots, logs) if tests fail
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-artifacts
          path: |
            screenshots/
            *.log